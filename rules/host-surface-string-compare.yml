id: host-surface-string-compare
language: JavaScript
severity: warning
message: >-
  用字符串字面量比较 surface（=== "desktop" / === "web"）是收口的对象。
  改为 host.js 的 isDesktop()（SURFACE-2）。
note: |
  与 surface-decision-outside-host 互补，不重叠：
  surface-decision-outside-host 抓 detectSurface()/adapterFor()/currentSurface() 的**调用形态**
  host-surface-string-compare  抓**裸变量**与 "desktop"/"web" 的比较

  存量（2026-10-22 实测）：lib/index.js:2345 的 `surface === "desktop"`（settle 作用域里传下来的变量）。
  settle-policy.js 的 4 处是纯函数接收 surface 参数，属于「A 类」，登记为豁免。
  本规则的 files 已从 lib/** 收窄成 lib/client-src/** + 显式 lib/index.js——
  收窄后命中数仍是 1，`test/rules-ratchet.test.mjs` 的 CEILING 同步为 1。
files:
  - "lib/client-src/**/*.js"
  - "lib/index.js"
ignores:
  # 纯函数，surface 由调用方传入，不自己探测 —— 不是「分散判定」
  - "lib/settle-policy.js"
  - "lib/surface.js"
  # lib/client-src/** 是**浏览器端**的内联片段（抽源后的产物源文件）。
  #
  # 它们不是 Node 模块，拿不到 host.js 的 isDesktop() —— 那是服务端判定，靠 argv /
  # 安装路径 / asar 探测。浏览器侧只能看 navigator.userAgent 与 location.port，
  # 这正是 clientGuessSurface() 的职责，与 SURFACE-2 要收口的「服务端判定散落」
  # 是两个面。
  #
  # 这些代码此前躺在 client.js 里，而 client.js 不在本规则的 files 里，
  # 所以当时的命中数是 1（只剩 index.js:2344）。抽源后代码换了目录、没换语义，
  # 命中数涨到 5 是「路径被纳入扫描」而不是「债务增加」—— 不要靠调 CEILING 消化它。
  - "lib/client-src/**"
rule:
  any:
    - pattern:
        context: 'if ($S === "desktop") {}'
        selector: binary_expression
    - pattern:
        context: 'if ($S !== "desktop") {}'
        selector: binary_expression
    - pattern:
        context: 'if ($S === "web") {}'
        selector: binary_expression
    - pattern:
        context: 'if ($S !== "web") {}'
        selector: binary_expression
constraints:
  S:
    kind: identifier
